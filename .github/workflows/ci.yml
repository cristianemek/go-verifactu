name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Validate XML against AEAT schema
        run: |
          shopt -s nullglob
          files=(testdata/xml/*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no XML files found in testdata/xml"
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "validating $file"
            xmllint --noout --schema schemas/v1.0/SuministroLR.xsd "$file"
          done