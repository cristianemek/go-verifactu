name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check formatting
        if: matrix.go-version == 'stable'
        run: |
          # gofmt -l sale 0 aunque encuentre ficheros; gofmt -d sale 1 desde
          # Go 1.27, y con bash -e eso mataria el paso sin imprimir nada.
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "estos ficheros necesitan gofmt:"
            echo "$files"
            gofmt -d . || true
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverpkg=./... -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage total
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage to Codecov
        if: matrix.go-version == 'stable'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Validate XML against AEAT schema
        run: |
          shopt -s nullglob
          files=(testdata/xml/peticion/*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no XML files found in testdata/xml/peticion"
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "validating $file"
            xmllint --noout --schema schemas/v1.0/SuministroLR.xsd "$file"
          done
          files=(testdata/xml/respuesta/*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no XML files found in testdata/xml/respuesta"
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "validating $file"
            xmllint --noout --schema schemas/v1.0/RespuestaSuministro.xsd "$file"
          done